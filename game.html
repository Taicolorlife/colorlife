<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b1238">
  <meta name="description" content="Kawaii 風格的銀河小蜜蜂網頁遊戲">
  <title>銀河小蜜蜂</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231b1238'/%3E%3Cellipse cx='32' cy='34' rx='18' ry='14' fill='%23ffd76e'/%3E%3Cpath d='M20 31h24M22 40h20' stroke='%23ff77aa' stroke-width='6'/%3E%3Ccircle cx='27' cy='30' r='2' fill='%231b1238'/%3E%3Ccircle cx='37' cy='30' r='2' fill='%231b1238'/%3E%3Cpath d='M27 36q5 5 10 0' fill='none' stroke='%231b1238' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: dark;
      --ink: #fff9ff;
      --muted: #cfc5e8;
      --night: #1b1238;
      --night-deep: #0d0924;
      --panel: rgba(42, 28, 78, .88);
      --line: rgba(255, 255, 255, .16);
      --pink: #ff7eb3;
      --pink-light: #ffc4df;
      --yellow: #ffd76e;
      --mint: #79efd0;
      --blue: #8ac8ff;
      --lavender: #b99cff;
      --danger: #ff658d;
      --shadow: 0 16px 50px rgba(6, 2, 25, .42);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100svh;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 12%, rgba(185,156,255,.22), transparent 28rem),
        radial-gradient(circle at 88% 82%, rgba(255,126,179,.16), transparent 24rem),
        linear-gradient(150deg, #22144a 0%, var(--night-deep) 64%, #160d32 100%);
      font-family: ui-rounded, "SF Pro Rounded", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      opacity: .48;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.65) 0 1px, transparent 1.4px),
        radial-gradient(circle, rgba(255,215,110,.5) 0 1px, transparent 1.5px);
      background-position: 0 0, 22px 25px;
      background-size: 46px 46px, 70px 70px;
      mask-image: linear-gradient(to bottom, black, transparent 88%);
      pointer-events: none;
    }

    button, a { -webkit-tap-highlight-color: transparent; }

    button { font: inherit; }

    .page-shell {
      width: min(100%, 780px);
      min-height: 100svh;
      margin: 0 auto;
      padding: max(14px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .topbar {
      width: min(100%, 560px);
      min-height: 42px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
    }

    .home-link {
      justify-self: start;
      min-height: 40px;
      padding: 8px 12px;
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink);
      background: rgba(255,255,255,.07);
      text-decoration: none;
      font-size: .9rem;
      font-weight: 700;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: transform 150ms ease, background 150ms ease;
    }

    .home-link:hover,
    .home-link:focus-visible {
      transform: translateY(-2px);
      background: rgba(255,255,255,.13);
      outline: none;
    }

    h1 {
      margin: 0;
      color: #fff;
      font-size: clamp(1rem, 4vw, 1.35rem);
      line-height: 1.1;
      letter-spacing: .08em;
      text-shadow: 0 3px 0 rgba(255,126,179,.38);
      white-space: nowrap;
    }

    .title-sparkle {
      display: inline-block;
      color: var(--yellow);
      animation: sparkle 1.8s ease-in-out infinite;
    }

    .top-spacer { min-width: 74px; }

    .hud {
      width: min(100%, 560px);
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 8px;
    }

    .hud-card {
      min-height: 54px;
      padding: 7px 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(43,29,78,.82);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .hud-label {
      color: var(--muted);
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .1em;
    }

    .hud-value {
      color: #fff;
      font-size: 1.05rem;
      font-variant-numeric: tabular-nums;
      font-weight: 900;
      line-height: 1.2;
    }

    .lives-card {
      min-width: 102px;
      align-items: flex-end;
    }

    .lives {
      color: var(--pink-light);
      font-size: 1.05rem;
      letter-spacing: .14em;
      text-shadow: 0 0 12px rgba(255,126,179,.55);
      white-space: nowrap;
    }

    .stage-shell {
      position: relative;
      width: min(94vw, 540px, calc((100svh - 190px) * .75));
      aspect-ratio: 3 / 4;
      min-width: 280px;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,.24);
      border-radius: 28px;
      background: #10092c;
      box-shadow: var(--shadow), 0 0 0 5px rgba(185,156,255,.08);
      touch-action: none;
    }

    .stage-shell::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      border-radius: inherit;
      box-shadow: inset 0 0 45px rgba(185,156,255,.16), inset 0 -45px 90px rgba(255,126,179,.08);
      pointer-events: none;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .screen-overlay {
      position: absolute;
      inset: 0;
      z-index: 5;
      padding: 26px;
      display: grid;
      place-items: center;
      background: rgba(12, 7, 34, .72);
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
      transition: opacity 180ms ease, visibility 180ms ease;
    }

    .screen-overlay.is-hidden {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .overlay-card {
      width: min(100%, 350px);
      padding: 27px 24px 24px;
      border: 2px solid rgba(255,255,255,.38);
      border-radius: 28px;
      color: var(--night);
      background: linear-gradient(150deg, #fff8fd, #f7eaff);
      box-shadow: 0 14px 0 rgba(185,156,255,.28), 0 24px 70px rgba(0,0,0,.35);
      text-align: center;
    }

    .mascot {
      width: 82px;
      height: 66px;
      margin: 0 auto 14px;
      position: relative;
      border: 3px solid #5a3d7a;
      border-radius: 52% 52% 45% 45%;
      background: repeating-linear-gradient(to bottom, var(--yellow) 0 13px, var(--pink) 13px 22px);
      box-shadow: inset 0 6px 0 rgba(255,255,255,.32), 0 8px 0 rgba(90,61,122,.12);
    }

    .mascot::before,
    .mascot::after {
      content: "";
      position: absolute;
      top: 12px;
      width: 34px;
      height: 43px;
      border: 3px solid #5a3d7a;
      background: rgba(138,200,255,.55);
    }

    .mascot::before { left: -27px; border-radius: 65% 30% 50% 70%; transform: rotate(-18deg); }
    .mascot::after { right: -27px; border-radius: 30% 65% 70% 50%; transform: rotate(18deg); }

    .mascot-face {
      position: absolute;
      z-index: 2;
      top: 20px;
      left: 20px;
      width: 8px;
      height: 10px;
      border-radius: 50%;
      background: #4d376b;
      box-shadow: 31px 0 0 #4d376b;
    }

    .mascot-face::before {
      content: "";
      position: absolute;
      width: 22px;
      height: 11px;
      top: 12px;
      left: 8px;
      border-bottom: 3px solid #4d376b;
      border-radius: 0 0 50% 50%;
    }

    .overlay-title {
      margin: 0;
      color: #3d285d;
      font-size: clamp(1.65rem, 7vw, 2.35rem);
      font-weight: 950;
      line-height: 1.2;
      letter-spacing: .03em;
    }

    .overlay-copy {
      margin: 12px 0 20px;
      color: #65547d;
      font-size: .96rem;
      line-height: 1.7;
    }

    .overlay-score {
      margin: 12px 0 20px;
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .overlay-score.is-visible { display: grid; }

    .result-chip {
      padding: 10px 8px;
      border: 1px solid rgba(90,61,122,.18);
      border-radius: 14px;
      color: #65547d;
      background: rgba(185,156,255,.12);
      font-size: .76rem;
      font-weight: 800;
    }

    .result-chip strong {
      display: block;
      margin-top: 3px;
      color: #3d285d;
      font-size: 1.12rem;
      font-variant-numeric: tabular-nums;
    }

    .main-button {
      width: 100%;
      min-height: 52px;
      padding: 12px 20px;
      border: 2px solid #51366f;
      border-radius: 18px;
      color: #3b2559;
      background: linear-gradient(135deg, var(--yellow), #fff0a9);
      box-shadow: 0 6px 0 #8b68b0;
      font-weight: 950;
      letter-spacing: .05em;
      cursor: pointer;
      transition: transform 120ms ease, box-shadow 120ms ease;
    }

    .main-button:hover,
    .main-button:focus-visible {
      transform: translateY(-2px);
      outline: none;
    }

    .main-button:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #8b68b0;
    }

    .controls {
      width: min(100%, 540px);
      padding-top: 2px;
      display: grid;
      grid-template-columns: 1fr 1fr 1.28fr;
      gap: 10px;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .control-button {
      min-height: 66px;
      padding: 8px;
      border: 1px solid rgba(255,255,255,.23);
      border-radius: 20px;
      color: #fff;
      background: linear-gradient(160deg, rgba(255,255,255,.15), rgba(255,255,255,.055));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.11), 0 7px 18px rgba(4,1,20,.22);
      font-size: 1.45rem;
      font-weight: 900;
      cursor: pointer;
      transition: transform 80ms ease, background 80ms ease;
    }

    .control-button span {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: .7rem;
      font-weight: 800;
      letter-spacing: .08em;
    }

    .control-button.fire {
      color: #44265f;
      background: linear-gradient(145deg, var(--pink), var(--pink-light));
    }

    .control-button.fire span { color: #5c386f; }

    .control-button.is-pressed,
    .control-button:active {
      transform: translateY(3px) scale(.98);
      background: rgba(185,156,255,.34);
    }

    .control-button.fire.is-pressed,
    .control-button.fire:active { background: linear-gradient(145deg, #ff659f, #ffabd0); }

    .keyboard-tip {
      margin: 0;
      color: var(--muted);
      font-size: .76rem;
      text-align: center;
    }

    @keyframes sparkle {
      0%, 100% { transform: scale(.82) rotate(-8deg); opacity: .65; }
      50% { transform: scale(1.12) rotate(8deg); opacity: 1; }
    }

    @media (hover: hover) and (pointer: fine) and (min-height: 760px) {
      .controls { max-width: 410px; }
    }

    @media (max-width: 520px) {
      .page-shell { padding-right: 10px; padding-left: 10px; gap: 8px; }
      .topbar { min-height: 38px; }
      .home-link { min-height: 36px; padding: 7px 10px; font-size: .82rem; }
      .top-spacer { min-width: 62px; }
      .hud-card { min-height: 48px; padding: 6px 10px; border-radius: 14px; }
      .hud-value { font-size: .96rem; }
      .lives-card { min-width: 92px; }
      .stage-shell { width: min(95vw, calc((100svh - 182px) * .75)); min-width: 270px; border-radius: 23px; }
      .screen-overlay { padding: 17px; }
      .overlay-card { padding: 22px 18px 20px; border-radius: 24px; }
      .mascot { transform: scale(.86); margin-bottom: 8px; }
      .overlay-copy { margin: 10px 0 16px; font-size: .9rem; }
      .controls { gap: 8px; }
      .control-button { min-height: 62px; border-radius: 17px; }
      .keyboard-tip { display: none; }
    }

    @media (max-height: 670px) and (orientation: landscape) {
      body { overflow: auto; }
      .page-shell {
        width: min(100%, 980px);
        min-height: 100vh;
        display: grid;
        grid-template-columns: minmax(330px, 1fr) minmax(250px, 340px);
        grid-template-rows: auto auto 1fr;
        align-items: start;
      }
      .topbar, .hud { grid-column: 2; width: 100%; }
      .stage-shell { grid-column: 1; grid-row: 1 / 4; width: min(70vh, 500px); justify-self: center; }
      .controls { grid-column: 2; width: 100%; align-self: end; }
      .keyboard-tip { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
    [hidden] { display: none !important; }
    .stage-shell { touch-action: auto; }
    canvas { touch-action: none; }
    .screen-overlay { display: flex; justify-content: center; align-items: center; overflow-y: auto; touch-action: pan-y; }
    .score-form, .score-form input, .score-form button { pointer-events: auto; }
    .score-form button { touch-action: manipulation; }
    .score-form button:focus-visible { outline: 3px solid #51366f; outline-offset: 3px; }
    .overlay-card { max-height: 100%; overflow-y: auto; min-height: 0; touch-action: pan-y; overscroll-behavior: contain; }
    .score-form { margin: 0 0 18px; text-align: left; }
    .score-form label { display: block; margin-bottom: 7px; color: #51366f; font-weight: 800; }
    .score-form input { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid #b99cff; border-radius: 12px; background: #fff; color: #3d285d; font: inherit; color-scheme: light; }
    .score-form button { width: 100%; margin-top: 9px; }
    .cloud-button { min-height: 42px; padding: 9px 14px; border: 1px solid #b99cff; border-radius: 12px; background: #e8dcff; color: #3d285d; font: inherit; font-weight: 800; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .save-status { margin: 8px 0 0; min-height: 1.4em; color: #65547d; font-size: .85rem; line-height: 1.5; }
    .leaderboard { width: min(100%, 480px); padding: 18px; border: 1px solid var(--line); border-radius: 20px; background: var(--panel); box-shadow: var(--shadow); }
    .leaderboard-heading { display: flex; gap: 10px; justify-content: space-between; align-items: center; }
    .leaderboard h2 { margin: 0; font-size: 1.1rem; color: var(--yellow); }
    .leaderboard p { color: var(--muted); font-size: .85rem; line-height: 1.5; }
    .leaderboard-scroll { overflow-x: auto; }
    .leaderboard table { width: 100%; border-collapse: collapse; text-align: left; font-size: .9rem; }
    .leaderboard th, .leaderboard td { padding: 10px 6px; border-bottom: 1px solid var(--line); }
    .leaderboard th:last-child, .leaderboard td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
    .leaderboard td:nth-child(2) { overflow-wrap: anywhere; }
    .leaderboard th:first-child { width: 46px; }
    @media (max-height: 670px) and (orientation: landscape) { .leaderboard { grid-column: 2; } }
  </style>
</head>
<body>
  <main class="page-shell">
    <header class="topbar">
      <a class="home-link" href="index.html">← 回首頁</a>
      <h1><span class="title-sparkle" aria-hidden="true">✦</span> 銀河小蜜蜂 <span class="title-sparkle" aria-hidden="true">✦</span></h1>
      <span class="top-spacer" aria-hidden="true"></span>
    </header>

    <section class="hud" aria-label="遊戲資訊">
      <div class="hud-card">
        <span class="hud-label">分數</span>
        <span class="hud-value" id="score">000000</span>
      </div>
      <div class="hud-card">
        <span class="hud-label">最高分</span>
        <span class="hud-value" id="highScore">000000</span>
      </div>
      <div class="hud-card lives-card">
        <span class="hud-label">生命</span>
        <span class="lives" id="lives" aria-label="三條生命">♥ ♥ ♥</span>
      </div>
    </section>

    <section class="stage-shell" aria-label="銀河小蜜蜂遊戲區">
      <canvas id="gameCanvas" width="480" height="640" role="img" aria-label="操控太空船射擊小蜜蜂敵人"></canvas>

      <div class="screen-overlay" id="screenOverlay">
        <div class="overlay-card">
          <div class="mascot" aria-hidden="true"><span class="mascot-face"></span></div>
          <h2 class="overlay-title" id="overlayTitle">準備出發！</h2>
          <p class="overlay-copy" id="overlayCopy">移動太空船，擊退從銀河飛來的小蜜蜂。</p>
          <div class="overlay-score" id="overlayScore">
            <div class="result-chip">本次分數<strong id="finalScore">0</strong></div>
            <div class="result-chip">最高分<strong id="finalHighScore">0</strong></div>
          </div>
          <section class="score-form" id="scoreForm" aria-label="儲存本次成績" hidden>
            <label for="nickname">留下暱稱，挑戰雲端排行榜</label>
            <input id="nickname" name="nickname" type="text" maxlength="20" placeholder="你的暱稱（最多 20 字）" autocomplete="nickname" aria-describedby="saveStatus">
            <button class="cloud-button" id="saveScoreButton" type="button">儲存分數</button>
            <p class="save-status" id="saveStatus" role="status" aria-live="polite"></p>
          </section>
          <button class="main-button" id="startButton" type="button">開始遊戲</button>
        </div>
      </div>
    </section>

    <section class="controls" aria-label="手機觸控操作">
      <button class="control-button" id="leftButton" type="button" aria-label="向左移動">←<span>向左</span></button>
      <button class="control-button" id="rightButton" type="button" aria-label="向右移動">→<span>向右</span></button>
      <button class="control-button fire" id="fireButton" type="button" aria-label="發射">●<span>發射</span></button>
    </section>

    <section class="leaderboard" aria-labelledby="leaderboardTitle">
      <div class="leaderboard-heading">
        <h2 id="leaderboardTitle">🏆 雲端排行榜 · 前 10 名</h2>
        <button class="cloud-button" id="refreshLeaderboard" type="button">更新</button>
      </div>
      <p>分數越高，排名越前面。</p>
      <p id="leaderboardStatus" role="status" aria-live="polite">正在讀取排行榜…</p>
      <div class="leaderboard-scroll">
        <table aria-label="雲端前十名排行榜">
          <thead><tr><th scope="col">名次</th><th scope="col">玩家暱稱</th><th scope="col">分數</th></tr></thead>
          <tbody id="leaderboardBody"></tbody>
        </table>
      </div>
    </section>
    <p class="keyboard-tip">鍵盤操作：← → 移動，空白鍵發射</p>
  </main>

  <script>
    (() => {
      'use strict';

      const homeLink = document.querySelector('.home-link');
      const fromPage = new URLSearchParams(window.location.search).get('from');
      if (fromPage && /^[^/\\?#]+\.html?$/i.test(fromPage)) {
        homeLink.href = fromPage;
      }

      const canvas = document.getElementById('gameCanvas');
      const context = canvas.getContext('2d');
      const scoreElement = document.getElementById('score');
      const highScoreElement = document.getElementById('highScore');
      const livesElement = document.getElementById('lives');
      const overlay = document.getElementById('screenOverlay');
      const overlayTitle = document.getElementById('overlayTitle');
      const overlayCopy = document.getElementById('overlayCopy');
      const overlayScore = document.getElementById('overlayScore');
      const finalScoreElement = document.getElementById('finalScore');
      const finalHighScoreElement = document.getElementById('finalHighScore');
      const startButton = document.getElementById('startButton');
      const leftButton = document.getElementById('leftButton');
      const rightButton = document.getElementById('rightButton');
      const fireButton = document.getElementById('fireButton');

      // 對應 Code.gs：GET ?action=top；POST JSON {action:'submit', nickname, score}。
      const LEADERBOARD_URL = 'https://script.google.com/macros/s/AKfycbxtfvLk3_xBFYK1qlF_4QgShc3yNifzlAxWpJvkKBHs7fh2erX2sRmn45Qr3M8u9dAB/exec';
      const scoreForm = document.getElementById('scoreForm');
      const nicknameInput = document.getElementById('nickname');
      const saveScoreButton = document.getElementById('saveScoreButton');
      const saveStatus = document.getElementById('saveStatus');
      const leaderboardBody = document.getElementById('leaderboardBody');
      const leaderboardStatus = document.getElementById('leaderboardStatus');
      const refreshLeaderboard = document.getElementById('refreshLeaderboard');
      let finalScore = null;
      let savingScore = false;
      let scoreSaved = false;
      let leaderboardRequest = 0;
      try { nicknameInput.value = localStorage.getItem('kawaiiGalaxianNicknameV1') || ''; } catch (_) {}

      async function cloudRequest(options = {}) {
        const controller = new AbortController();
        const timeout = window.setTimeout(() => controller.abort(), 20000);
        try {
          const isSubmit = options.method === 'POST';
          const response = await fetch(LEADERBOARD_URL + (isSubmit ? '' : '?action=top'), {
            ...options, signal: controller.signal, redirect: 'follow', credentials: 'omit', cache: 'no-store'
          });
          if (!response.ok) throw new Error('伺服器回應失敗（' + response.status + '）。');
          let data;
          try { data = await response.json(); }
          catch (_) { throw new Error('無法讀取排行榜資料，請確認 Apps Script 已部署為任何人可存取。'); }
          if (!data || data.ok !== true) {
            throw new Error(data?.error?.message || (typeof data?.error === 'string' ? data.error : '排行榜服務回應失敗。'));
          }
          return data;
        } catch (error) {
          if (error.name === 'AbortError') throw new Error('連線逾時，請稍後再試。');
          if (error instanceof TypeError) throw new Error('無法連上雲端，請檢查網路及 Apps Script 的公開部署設定。');
          throw error;
        } finally { window.clearTimeout(timeout); }
      }

      function renderLeaderboard(rows) {
        if (!Array.isArray(rows)) throw new Error('排行榜資料格式不正確。');
        const fragment = document.createDocumentFragment();
        rows.slice(0, 10).forEach((item, index) => {
          if (!item || typeof item.nickname !== 'string' || !Number.isFinite(Number(item.score))) {
            throw new Error('排行榜資料格式不正確。');
          }
          const tr = document.createElement('tr');
          [String(index + 1), item.nickname, Number(item.score).toLocaleString('zh-TW')].forEach((value) => {
            const td = document.createElement('td');
            td.textContent = value;
            tr.appendChild(td);
          });
          fragment.appendChild(tr);
        });
        leaderboardBody.replaceChildren(fragment);
        leaderboardStatus.textContent = rows.length ? '已更新 · 依雲端排名顯示' : '還沒有成績，來成為第一位玩家吧！';
      }

      async function loadLeaderboard() {
        const request = ++leaderboardRequest;
        refreshLeaderboard.disabled = true;
        leaderboardStatus.textContent = '正在讀取排行榜…';
        try {
          const data = await cloudRequest();
          if (request === leaderboardRequest) renderLeaderboard(data.leaderboard);
        } catch (error) {
          if (request === leaderboardRequest) leaderboardStatus.textContent = error.message + ' 可按「更新」重試。';
        } finally {
          if (request === leaderboardRequest) refreshLeaderboard.disabled = false;
        }
      }

      async function saveFinalScore() {
        if (savingScore) return;
        if (scoreSaved) {
          saveStatus.textContent = '本次成績已處理，可以重新開始。';
          return;
        }
        if (state !== 'gameover' || finalScore === null) {
          saveStatus.textContent = '請先完成一場遊戲，再儲存成績。';
          return;
        }
        const nickname = nicknameInput.value.trim();
        if (!nickname) {
          saveStatus.textContent = '請先輸入暱稱。';
          nicknameInput.focus();
          return;
        }
        if (Array.from(nickname.normalize('NFKC')).length > 20) {
          saveStatus.textContent = '暱稱最多 20 字，請縮短後再按儲存。';
          nicknameInput.focus();
          return;
        }
        savingScore = true;
        saveScoreButton.disabled = true;
        nicknameInput.disabled = true;
        startButton.disabled = true;
        saveStatus.textContent = '正在儲存分數…';
        try {
          // text/plain 可避免 application/json 的跨網域預檢；須讀取回應才能確認儲存成功。
          const data = await cloudRequest({
            method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'submit', nickname, score: finalScore })
          });
          scoreSaved = true;
          saveScoreButton.textContent = '已儲存 ✓';
          saveStatus.textContent = data.saved === false
            ? '雲端已收到本次成績；未超過你的最佳分數，排行榜保留最高分。'
            : '分數已儲存到雲端！';
          try { localStorage.setItem('kawaiiGalaxianNicknameV1', nickname); } catch (_) {}
          if (Array.isArray(data.leaderboard)) {
            ++leaderboardRequest;
            refreshLeaderboard.disabled = false;
            try { renderLeaderboard(data.leaderboard); }
            catch (_) { await loadLeaderboard(); }
          } else { await loadLeaderboard(); }
        } catch (error) {
          saveStatus.textContent = error.message + ' 尚未確認儲存成功，可先更新排行榜確認，再重試。';
          saveScoreButton.textContent = '重試儲存';
        } finally {
          savingScore = false;
          saveScoreButton.disabled = scoreSaved;
          nicknameInput.disabled = scoreSaved;
          startButton.disabled = false;
        }
      }
      // 直接處理 click，無須透過原生表單提交，兼容限制表單的 HTML 預覽。
      saveScoreButton.addEventListener('click', saveFinalScore);
      nicknameInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.isComposing) {
          event.preventDefault();
          saveFinalScore();
        }
      });
      refreshLeaderboard.addEventListener('click', loadLeaderboard);

      const WIDTH = 480;
      const HEIGHT = 640;
      const STORAGE_KEY = 'kawaiiGalaxianHighScoreV1';
      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const colors = {
        pink: '#ff7eb3',
        pinkLight: '#ffc4df',
        yellow: '#ffd76e',
        mint: '#79efd0',
        blue: '#8ac8ff',
        lavender: '#b99cff',
        ink: '#4f376b',
        white: '#fffaff'
      };

      let state = 'ready';
      let score = 0;
      let highScore = loadHighScore();
      let recordAtStart = highScore;
      let lives = 3;
      let wave = 1;
      let waveDelay = 0;
      let lastTime = performance.now();
      let enemyDiveTimer = 1.4;
      let enemyShotTimer = 1.05;
      let screenShake = 0;
      let flash = 0;
      let elapsed = 0;

      const input = { left: false, right: false, fire: false };
      const player = { x: WIDTH / 2, y: HEIGHT - 62, width: 38, height: 34, speed: 285, cooldown: 0, invulnerable: 0 };
      let playerBullets = [];
      let enemyBullets = [];
      let enemies = [];
      let particles = [];
      let floatingScores = [];
      let stars = [];

      function loadHighScore() {
        try {
          const value = Number.parseInt(localStorage.getItem(STORAGE_KEY) || '0', 10);
          return Number.isFinite(value) ? Math.max(0, value) : 0;
        } catch (error) {
          return 0;
        }
      }

      function saveHighScore() {
        try {
          localStorage.setItem(STORAGE_KEY, String(highScore));
        } catch (error) {
          // 儲存空間不可用時，仍可正常遊玩。
        }
      }

      function setupCanvas() {
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(WIDTH * ratio);
        canvas.height = Math.round(HEIGHT * ratio);
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
      }

      function makeStars() {
        stars = Array.from({ length: 82 }, (_, index) => ({
          x: (index * 83.17) % WIDTH,
          y: (index * 137.43) % HEIGHT,
          size: 0.7 + (index % 5) * 0.35,
          speed: 7 + (index % 6) * 3,
          phase: index * 0.63,
          color: index % 8 === 0 ? colors.yellow : (index % 5 === 0 ? colors.pinkLight : colors.white)
        }));
      }

      function formatScore(value) {
        return String(Math.max(0, Math.floor(value))).padStart(6, '0');
      }

      function updateHud() {
        scoreElement.textContent = formatScore(score);
        highScoreElement.textContent = formatScore(highScore);
        livesElement.textContent = Array.from({ length: Math.max(0, lives) }, () => '♥').join(' ');
        livesElement.setAttribute('aria-label', lives + ' 條生命');
      }

      function createFormation() {
        enemies = [];
        const columns = 7;
        const rows = 4;
        const spacingX = 54;
        const spacingY = 46;
        const startX = WIDTH / 2 - ((columns - 1) * spacingX) / 2;
        const startY = 112;

        for (let row = 0; row < rows; row += 1) {
          for (let column = 0; column < columns; column += 1) {
            const homeX = startX + column * spacingX;
            const homeY = startY + row * spacingY;
            enemies.push({
              x: homeX,
              y: -80 - row * 52 - column * 5,
              homeX,
              homeY,
              width: 32,
              height: 28,
              row,
              column,
              alive: true,
              diving: false,
              entering: true,
              diveTime: 0,
              diveStartX: homeX,
              diveStartY: homeY,
              diveTargetX: WIDTH / 2,
              firedInDive: false,
              phase: column * .68 + row * .37
            });
          }
        }
      }

      function resetPlayer() {
        player.x = WIDTH / 2;
        player.y = HEIGHT - 62;
        player.cooldown = 0;
        player.invulnerable = 1.35;
      }

      function startGame() {
        if (savingScore) return;
        finalScore = null;
        scoreForm.hidden = true;
        state = 'playing';
        score = 0;
        recordAtStart = highScore;
        lives = 3;
        wave = 1;
        waveDelay = 0;
        enemyDiveTimer = 1.6;
        enemyShotTimer = 1.15;
        screenShake = 0;
        flash = 0;
        playerBullets = [];
        enemyBullets = [];
        particles = [];
        floatingScores = [];
        resetPlayer();
        createFormation();
        overlay.classList.add('is-hidden');
        updateHud();
        lastTime = performance.now();
      }

      function endGame() {
        state = 'gameover';
        finalScore = score;
        scoreSaved = false;
        scoreForm.hidden = false;
        nicknameInput.disabled = false;
        saveScoreButton.disabled = false;
        saveScoreButton.textContent = '儲存分數';
        saveStatus.textContent = '輸入暱稱後儲存本次成績，也可以直接重新開始。';
        loadLeaderboard();
        input.left = false;
        input.right = false;
        input.fire = false;

        const isNewHighScore = score > recordAtStart;
        if (score > highScore) {
          highScore = score;
        }
        saveHighScore();

        updateHud();
        finalScoreElement.textContent = score;
        finalHighScoreElement.textContent = highScore;
        overlayTitle.textContent = '遊戲結束';
        overlayCopy.textContent = isNewHighScore ? '新紀錄！小蜜蜂們都在替你鼓掌。' : '再試一次，下一趟銀河旅程會更閃亮。';
        overlayScore.classList.add('is-visible');
        startButton.textContent = '重新開始';
        overlay.classList.remove('is-hidden');
      }

      function firePlayerBullet() {
        if (state !== 'playing' || player.cooldown > 0) return;
        playerBullets.push({ x: player.x, y: player.y - 23, speed: 455, radius: 4 });
        player.cooldown = .19;
        burst(player.x, player.y - 20, colors.mint, 3, 35);
      }

      function fireEnemyBullet(enemy) {
        const dx = player.x - enemy.x;
        const dy = player.y - enemy.y;
        const length = Math.hypot(dx, dy) || 1;
        const speed = 185 + wave * 7;
        enemyBullets.push({
          x: enemy.x,
          y: enemy.y + 12,
          vx: (dx / length) * speed,
          vy: Math.max(115, (dy / length) * speed),
          radius: 5
        });
      }

      function burst(x, y, color, count = 12, speed = 95) {
        const actualCount = prefersReducedMotion ? Math.ceil(count * .45) : count;
        for (let index = 0; index < actualCount; index += 1) {
          const angle = (Math.PI * 2 * index) / actualCount + Math.random() * .34;
          const velocity = speed * (.48 + Math.random() * .65);
          particles.push({
            x,
            y,
            vx: Math.cos(angle) * velocity,
            vy: Math.sin(angle) * velocity,
            life: .42 + Math.random() * .45,
            maxLife: .87,
            size: 2 + Math.random() * 3.8,
            color
          });
        }
      }

      function circleHit(a, b, radiusA, radiusB) {
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        const radius = radiusA + radiusB;
        return dx * dx + dy * dy < radius * radius;
      }

      function chooseDiver() {
        const candidates = enemies.filter((enemy) => enemy.alive && !enemy.diving && !enemy.entering);
        if (!candidates.length) return;
        const enemy = candidates[Math.floor(Math.random() * candidates.length)];
        enemy.diving = true;
        enemy.diveTime = 0;
        enemy.diveStartX = enemy.x;
        enemy.diveStartY = enemy.y;
        enemy.diveTargetX = player.x + (Math.random() - .5) * 120;
        enemy.firedInDive = false;
      }

      function hitPlayer() {
        if (player.invulnerable > 0 || state !== 'playing') return;
        lives -= 1;
        player.invulnerable = 2;
        screenShake = 12;
        flash = .15;
        burst(player.x, player.y, colors.pink, 22, 145);

        if (navigator.vibrate) navigator.vibrate(60);

        if (lives <= 0) {
          updateHud();
          window.setTimeout(endGame, 380);
        } else {
          resetPlayer();
          updateHud();
        }
      }

      function defeatEnemy(enemy) {
        enemy.alive = false;
        const gained = 100 + enemy.row * 25 + (enemy.diving ? 75 : 0);
        score += gained;
        if (score > highScore) highScore = score;
        burst(enemy.x, enemy.y, [colors.yellow, colors.pink, colors.mint][enemy.row % 3], 16, 120);
        floatingScores.push({ x: enemy.x, y: enemy.y, value: '+' + gained, life: .75 });
        updateHud();
      }

      function updatePlayer(delta) {
        const direction = (input.right ? 1 : 0) - (input.left ? 1 : 0);
        player.x += direction * player.speed * delta;
        player.x = Math.max(26, Math.min(WIDTH - 26, player.x));
        player.cooldown = Math.max(0, player.cooldown - delta);
        player.invulnerable = Math.max(0, player.invulnerable - delta);
        if (input.fire) firePlayerBullet();
      }

      function updateEnemies(delta) {
        const formationShift = Math.sin(elapsed * .72) * Math.min(28, 13 + wave * 2);

        enemies.forEach((enemy) => {
          if (!enemy.alive) return;

          if (enemy.entering) {
            const targetX = enemy.homeX + formationShift;
            enemy.x += (targetX - enemy.x) * Math.min(1, delta * 4.1);
            enemy.y += (enemy.homeY - enemy.y) * Math.min(1, delta * 3.6);
            if (Math.abs(enemy.y - enemy.homeY) < 1.5) {
              enemy.entering = false;
              enemy.y = enemy.homeY;
            }
            return;
          }

          if (enemy.diving) {
            enemy.diveTime += delta * (.44 + wave * .018);
            const t = enemy.diveTime;
            const eased = Math.min(1, t * t * (3 - 2 * t));
            const side = enemy.column % 2 === 0 ? 1 : -1;
            enemy.x = enemy.diveStartX + (enemy.diveTargetX - enemy.diveStartX) * eased + Math.sin(t * Math.PI * 2.25) * 72 * side;
            enemy.y = enemy.diveStartY + t * (HEIGHT + 90);

            if (!enemy.firedInDive && t > .34) {
              enemy.firedInDive = true;
              fireEnemyBullet(enemy);
            }

            if (enemy.y > HEIGHT + 40) {
              enemy.diving = false;
              enemy.entering = true;
              enemy.x = enemy.homeX;
              enemy.y = -38;
              enemy.diveTime = 0;
            }
          } else {
            enemy.x = enemy.homeX + formationShift + Math.sin(elapsed * 1.5 + enemy.phase) * 3;
            enemy.y = enemy.homeY + Math.cos(elapsed * 1.2 + enemy.phase) * 3;
          }

          if (enemy.diving && circleHit(enemy, player, 15, 17)) {
            enemy.alive = false;
            burst(enemy.x, enemy.y, colors.yellow, 14, 110);
            hitPlayer();
          }
        });

        enemyDiveTimer -= delta;
        if (enemyDiveTimer <= 0) {
          chooseDiver();
          enemyDiveTimer = Math.max(.54, 1.65 - wave * .08) + Math.random() * .7;
        }

        enemyShotTimer -= delta;
        if (enemyShotTimer <= 0) {
          const shooters = enemies.filter((enemy) => enemy.alive && !enemy.entering && enemy.y < HEIGHT - 120);
          if (shooters.length) fireEnemyBullet(shooters[Math.floor(Math.random() * shooters.length)]);
          enemyShotTimer = Math.max(.5, 1.24 - wave * .055) + Math.random() * .5;
        }
      }

      function updateBullets(delta) {
        playerBullets.forEach((bullet) => { bullet.y -= bullet.speed * delta; });
        playerBullets = playerBullets.filter((bullet) => bullet.y > -20);

        enemyBullets.forEach((bullet) => {
          bullet.x += bullet.vx * delta;
          bullet.y += bullet.vy * delta;
        });
        enemyBullets = enemyBullets.filter((bullet) => bullet.y < HEIGHT + 24 && bullet.x > -24 && bullet.x < WIDTH + 24);

        for (let bulletIndex = playerBullets.length - 1; bulletIndex >= 0; bulletIndex -= 1) {
          const bullet = playerBullets[bulletIndex];
          let hit = false;
          for (const enemy of enemies) {
            if (!enemy.alive) continue;
            if (circleHit(bullet, enemy, bullet.radius, 15)) {
              defeatEnemy(enemy);
              hit = true;
              break;
            }
          }
          if (hit) playerBullets.splice(bulletIndex, 1);
        }

        for (let index = enemyBullets.length - 1; index >= 0; index -= 1) {
          if (circleHit(enemyBullets[index], player, enemyBullets[index].radius, 16)) {
            enemyBullets.splice(index, 1);
            hitPlayer();
          }
        }
      }

      function updateEffects(delta) {
        particles.forEach((particle) => {
          particle.x += particle.vx * delta;
          particle.y += particle.vy * delta;
          particle.vy += 28 * delta;
          particle.life -= delta;
        });
        particles = particles.filter((particle) => particle.life > 0);

        floatingScores.forEach((item) => {
          item.y -= 32 * delta;
          item.life -= delta;
        });
        floatingScores = floatingScores.filter((item) => item.life > 0);

        stars.forEach((star) => {
          star.y += star.speed * delta;
          if (star.y > HEIGHT + 4) star.y = -4;
        });

        screenShake = Math.max(0, screenShake - 42 * delta);
        flash = Math.max(0, flash - delta);
      }

      function update(delta) {
        elapsed += delta;
        updateEffects(delta);
        if (state !== 'playing') return;

        updatePlayer(delta);
        updateEnemies(delta);
        updateBullets(delta);

        if (!enemies.some((enemy) => enemy.alive)) {
          waveDelay += delta;
          if (waveDelay > 1.15) {
            wave += 1;
            waveDelay = 0;
            score += 500;
            if (score > highScore) highScore = score;
            createFormation();
            updateHud();
          }
        }
      }

      function roundedRect(ctx, x, y, width, height, radius) {
        const r = Math.min(radius, width / 2, height / 2);
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + width, y, x + width, y + height, r);
        ctx.arcTo(x + width, y + height, x, y + height, r);
        ctx.arcTo(x, y + height, x, y, r);
        ctx.arcTo(x, y, x + width, y, r);
        ctx.closePath();
      }

      function drawBackground() {
        const gradient = context.createLinearGradient(0, 0, 0, HEIGHT);
        gradient.addColorStop(0, '#1d1243');
        gradient.addColorStop(.58, '#10092c');
        gradient.addColorStop(1, '#21103c');
        context.fillStyle = gradient;
        context.fillRect(0, 0, WIDTH, HEIGHT);

        const glow = context.createRadialGradient(WIDTH * .5, HEIGHT * .28, 8, WIDTH * .5, HEIGHT * .28, 260);
        glow.addColorStop(0, 'rgba(185,156,255,.12)');
        glow.addColorStop(1, 'rgba(185,156,255,0)');
        context.fillStyle = glow;
        context.fillRect(0, 0, WIDTH, HEIGHT);

        stars.forEach((star) => {
          const twinkle = .45 + Math.sin(elapsed * 2.2 + star.phase) * .28;
          context.globalAlpha = twinkle;
          context.fillStyle = star.color;
          context.beginPath();
          context.arc(star.x, star.y, star.size, 0, Math.PI * 2);
          context.fill();
          if (star.size > 1.6) {
            context.strokeStyle = star.color;
            context.lineWidth = .7;
            context.beginPath();
            context.moveTo(star.x - 4, star.y);
            context.lineTo(star.x + 4, star.y);
            context.moveTo(star.x, star.y - 4);
            context.lineTo(star.x, star.y + 4);
            context.stroke();
          }
        });
        context.globalAlpha = 1;
      }

      function drawEnemy(enemy) {
        if (!enemy.alive) return;
        context.save();
        context.translate(enemy.x, enemy.y);
        const tilt = enemy.diving ? Math.sin(enemy.diveTime * 8) * .28 : Math.sin(elapsed * 2 + enemy.phase) * .05;
        context.rotate(tilt);
        const wingLift = Math.sin(elapsed * 9 + enemy.phase) * 3;
        const bodyColor = [colors.yellow, colors.pink, colors.mint, colors.lavender][enemy.row % 4];

        context.fillStyle = 'rgba(138,200,255,.55)';
        context.strokeStyle = 'rgba(255,255,255,.7)';
        context.lineWidth = 1.5;
        context.beginPath();
        context.ellipse(-17, wingLift, 12, 8, -.42, 0, Math.PI * 2);
        context.ellipse(17, -wingLift, 12, 8, .42, 0, Math.PI * 2);
        context.fill();
        context.stroke();

        context.fillStyle = bodyColor;
        context.strokeStyle = colors.ink;
        context.lineWidth = 2.2;
        context.beginPath();
        context.ellipse(0, 1, 15, 14, 0, 0, Math.PI * 2);
        context.fill();
        context.stroke();

        context.fillStyle = 'rgba(255,255,255,.36)';
        context.beginPath();
        context.ellipse(-4, -5, 6, 3, -.25, 0, Math.PI * 2);
        context.fill();

        context.fillStyle = colors.ink;
        context.beginPath();
        context.arc(-5, 0, 1.8, 0, Math.PI * 2);
        context.arc(5, 0, 1.8, 0, Math.PI * 2);
        context.fill();

        context.strokeStyle = colors.ink;
        context.lineWidth = 1.6;
        context.lineCap = 'round';
        context.beginPath();
        context.arc(0, 2, 5, .2, Math.PI - .2);
        context.stroke();

        context.fillStyle = 'rgba(255,105,150,.58)';
        context.beginPath();
        context.arc(-9, 5, 2.6, 0, Math.PI * 2);
        context.arc(9, 5, 2.6, 0, Math.PI * 2);
        context.fill();

        context.strokeStyle = colors.ink;
        context.lineWidth = 1.4;
        context.beginPath();
        context.moveTo(-7, -12);
        context.quadraticCurveTo(-11, -21, -15, -19);
        context.moveTo(7, -12);
        context.quadraticCurveTo(11, -21, 15, -19);
        context.stroke();
        context.restore();
      }

      function drawPlayer() {
        if (state === 'gameover' && lives <= 0) return;
        if (player.invulnerable > 0 && Math.floor(player.invulnerable * 11) % 2 === 0) return;

        context.save();
        context.translate(player.x, player.y);
        const lean = ((input.right ? 1 : 0) - (input.left ? 1 : 0)) * .08;
        context.rotate(lean);

        context.fillStyle = 'rgba(121,239,208,.34)';
        context.beginPath();
        context.moveTo(-10, 16);
        context.quadraticCurveTo(0, 31 + Math.sin(elapsed * 20) * 4, 10, 16);
        context.closePath();
        context.fill();

        context.fillStyle = colors.pink;
        context.strokeStyle = colors.white;
        context.lineWidth = 2;
        context.beginPath();
        context.moveTo(0, -24);
        context.quadraticCurveTo(11, -9, 20, 18);
        context.lineTo(7, 13);
        context.lineTo(0, 20);
        context.lineTo(-7, 13);
        context.lineTo(-20, 18);
        context.quadraticCurveTo(-11, -9, 0, -24);
        context.closePath();
        context.fill();
        context.stroke();

        context.fillStyle = colors.blue;
        context.strokeStyle = colors.white;
        context.lineWidth = 1.5;
        context.beginPath();
        context.ellipse(0, -5, 8, 11, 0, 0, Math.PI * 2);
        context.fill();
        context.stroke();

        context.fillStyle = colors.ink;
        context.beginPath();
        context.arc(-3, -5, 1.25, 0, Math.PI * 2);
        context.arc(3, -5, 1.25, 0, Math.PI * 2);
        context.fill();
        context.strokeStyle = colors.ink;
        context.lineWidth = 1;
        context.beginPath();
        context.arc(0, -3, 3, .2, Math.PI - .2);
        context.stroke();
        context.restore();
      }

      function drawBullets() {
        playerBullets.forEach((bullet) => {
          const glow = context.createRadialGradient(bullet.x, bullet.y, 0, bullet.x, bullet.y, 12);
          glow.addColorStop(0, 'rgba(121,239,208,.8)');
          glow.addColorStop(1, 'rgba(121,239,208,0)');
          context.fillStyle = glow;
          context.fillRect(bullet.x - 12, bullet.y - 12, 24, 24);
          context.fillStyle = colors.white;
          roundedRect(context, bullet.x - 2.5, bullet.y - 10, 5, 16, 3);
          context.fill();
        });

        enemyBullets.forEach((bullet) => {
          context.fillStyle = colors.yellow;
          context.strokeStyle = colors.pink;
          context.lineWidth = 2;
          context.beginPath();
          context.arc(bullet.x, bullet.y, bullet.radius, 0, Math.PI * 2);
          context.fill();
          context.stroke();
        });
      }

      function drawEffects() {
        particles.forEach((particle) => {
          const alpha = Math.max(0, particle.life / particle.maxLife);
          context.globalAlpha = alpha;
          context.fillStyle = particle.color;
          context.beginPath();
          context.arc(particle.x, particle.y, particle.size * alpha, 0, Math.PI * 2);
          context.fill();
        });
        context.globalAlpha = 1;

        floatingScores.forEach((item) => {
          context.globalAlpha = Math.max(0, item.life / .75);
          context.fillStyle = colors.yellow;
          context.font = '800 14px ui-rounded, system-ui, sans-serif';
          context.textAlign = 'center';
          context.fillText(item.value, item.x, item.y);
        });
        context.globalAlpha = 1;
      }

      function drawWaveLabel() {
        if (state !== 'playing') return;
        context.fillStyle = 'rgba(255,255,255,.48)';
        context.font = '700 12px ui-rounded, system-ui, sans-serif';
        context.textAlign = 'right';
        context.fillText('第 ' + wave + ' 波', WIDTH - 16, 24);
      }

      function render() {
        context.save();
        context.setTransform(canvas.width / WIDTH, 0, 0, canvas.height / HEIGHT, 0, 0);
        drawBackground();

        if (screenShake > 0 && !prefersReducedMotion) {
          context.translate((Math.random() - .5) * screenShake, (Math.random() - .5) * screenShake);
        }

        enemies.forEach(drawEnemy);
        drawBullets();
        drawPlayer();
        drawEffects();
        drawWaveLabel();

        if (flash > 0) {
          context.fillStyle = 'rgba(255,255,255,' + Math.min(.42, flash * 2.8) + ')';
          context.fillRect(0, 0, WIDTH, HEIGHT);
        }
        context.restore();
      }

      function gameLoop(now) {
        const delta = Math.min(.034, Math.max(0, (now - lastTime) / 1000));
        lastTime = now;
        update(delta);
        render();
        window.requestAnimationFrame(gameLoop);
      }

      function setInput(name, pressed, element) {
        input[name] = pressed;
        if (element) element.classList.toggle('is-pressed', pressed);
        if (pressed && name === 'fire') {
          if (state === 'ready' || state === 'gameover') startGame();
          else firePlayerBullet();
        }
      }

      function bindHoldButton(element, name) {
        element.addEventListener('pointerdown', (event) => {
          event.preventDefault();
          element.setPointerCapture?.(event.pointerId);
          setInput(name, true, element);
        });

        const release = (event) => {
          event.preventDefault();
          setInput(name, false, element);
        };

        element.addEventListener('pointerup', release);
        element.addEventListener('pointercancel', release);
        element.addEventListener('lostpointercapture', () => setInput(name, false, element));
      }

      window.addEventListener('keydown', (event) => {
        if (event.target instanceof HTMLElement && event.target.closest('input, textarea, select, button, [contenteditable]')) return;
        if (savingScore) return;
        if (event.code === 'ArrowLeft') {
          input.left = true;
          event.preventDefault();
        } else if (event.code === 'ArrowRight') {
          input.right = true;
          event.preventDefault();
        } else if (event.code === 'Space') {
          event.preventDefault();
          if (state === 'ready' || state === 'gameover') startGame();
          input.fire = true;
          firePlayerBullet();
        }
      });

      window.addEventListener('keyup', (event) => {
        if (event.code === 'ArrowLeft') input.left = false;
        if (event.code === 'ArrowRight') input.right = false;
        if (event.code === 'Space') input.fire = false;
      });

      window.addEventListener('blur', () => {
        input.left = false;
        input.right = false;
        input.fire = false;
        leftButton.classList.remove('is-pressed');
        rightButton.classList.remove('is-pressed');
        fireButton.classList.remove('is-pressed');
      });

      startButton.addEventListener('click', startGame);
      bindHoldButton(leftButton, 'left');
      bindHoldButton(rightButton, 'right');
      bindHoldButton(fireButton, 'fire');

      window.addEventListener('resize', setupCanvas);
      setupCanvas();
      makeStars();
      updateHud();
      render();
      loadLeaderboard();
      window.requestAnimationFrame(gameLoop);
    })();
  </script>
</body>
</html>
