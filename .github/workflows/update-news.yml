name: Update Google Alerts news

on:
  schedule:
    - cron: '0 0 * * *' # Taiwan 08:00 (UTC+8); GitHub may delay scheduled runs.
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-google-alerts-news
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch alerts and preserve their original categories
        shell: bash
        run: |
          python3 <<'PY'
          import datetime as dt
          import email.utils
          import html
          from html.parser import HTMLParser
          import json
          from pathlib import Path
          import re
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET

          FEEDS = [
              'https://www.google.com.tw/alerts/feeds/10594208169593525725/16445985547973540376',
              'https://www.google.com.tw/alerts/feeds/10594208169593525725/9096331103681265855',
              'https://www.google.com.tw/alerts/feeds/10594208169593525725/762068992082586163',
          ]
          CATEGORIES = [
              {'id': 'color-psychology', 'name': '色彩心理'},
              {'id': 'ai-effects', 'name': 'AI效應'},
              {'id': 'color', 'name': 'color'},
          ]

          class PlainText(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []
              def handle_data(self, data):
                  self.parts.append(data)

          def clean(value):
              parser = PlainText()
              parser.feed(value or '')
              return re.sub(r'\s+', ' ', html.unescape(''.join(parser.parts))).strip()

          def local(tag):
              return tag.rsplit('}', 1)[-1]

          def child(node, name):
              return next((n for n in node if local(n.tag) == name), None)

          def text(node, name):
              value = child(node, name)
              return ''.join(value.itertext()).strip() if value is not None else ''

          def category_from_title(title):
              normalized = re.sub(r'\s+', '', title).casefold()
              # A Google Alerts feed title contains its original alert query.
              for category in CATEGORIES:
                  if category['name'].casefold() in normalized:
                      return category['id']
              raise ValueError('Unrecognized Google Alerts feed title: ' + title)

          def article_url(value):
              parsed = urllib.parse.urlsplit(value)
              host = (parsed.hostname or '').lower()
              if host == 'google.com' or host.endswith('.google.com') or host == 'google.com.tw' or host.endswith('.google.com.tw'):
                  params = urllib.parse.parse_qs(parsed.query)
                  value = (params.get('url') or params.get('q') or [value])[0]
              parsed = urllib.parse.urlsplit(value)
              if parsed.scheme not in ('https', 'http') or not parsed.hostname or parsed.username or parsed.password:
                  return ''
              return urllib.parse.urlunsplit(parsed._replace(fragment=''))

          def timestamp(value):
              if not value:
                  return ''
              try:
                  date = dt.datetime.fromisoformat(value.replace('Z', '+00:00'))
              except ValueError:
                  try:
                      date = email.utils.parsedate_to_datetime(value)
                  except (ValueError, TypeError):
                      return ''
              if date.tzinfo is None:
                  date = date.replace(tzinfo=dt.timezone.utc)
              return date.astimezone(dt.timezone.utc).isoformat()

          items, seen, found, feed_info = [], set(), set(), []
          for feed_url in FEEDS:
              request = urllib.request.Request(feed_url, headers={'User-Agent': 'Colorlife-News/1.0'})
              with urllib.request.urlopen(request, timeout=40) as response:
                  root = ET.fromstring(response.read())
              if local(root.tag) == 'feed':
                  container = root
              elif local(root.tag) == 'rss':
                  container = child(root, 'channel')
              else:
                  raise ValueError('Unexpected feed response; existing news.json was not changed')
              if container is None:
                  raise ValueError('Feed channel missing')
              feed_title = clean(text(container, 'title'))
              category = category_from_title(feed_title)
              found.add(category)
              feed_info.append({'url': feed_url, 'title': feed_title, 'category': category})
              for entry in container:
                  if local(entry.tag) not in ('entry', 'item'):
                      continue
                  title = clean(text(entry, 'title'))
                  link = next((n.get('href', '') for n in entry if local(n.tag) == 'link' and n.get('rel', 'alternate') == 'alternate' and n.get('href')), '')
                  url = article_url(link or text(entry, 'link'))
                  key = (category, url)
                  if not title or not url or key in seen:
                      continue
                  seen.add(key)
                  published = timestamp(text(entry, 'published') or text(entry, 'pubDate') or text(entry, 'updated'))
                  items.append({
                      'category': category,
                      'feed_title': feed_title,
                      'title': title[:200],
                      'url': url,
                      'source': urllib.parse.urlsplit(url).hostname,
                      'published_at': published,
                      'summary': clean(text(entry, 'content') or text(entry, 'summary') or text(entry, 'description'))[:300],
                  })
          if found != {c['id'] for c in CATEGORIES}:
              raise ValueError('The three RSS feeds do not match all three alert categories; existing news.json was not changed')
          items.sort(key=lambda item: item['published_at'], reverse=True)
          result = {'updated_at': dt.datetime.now(dt.timezone.utc).isoformat(), 'categories': CATEGORIES, 'feeds': feed_info, 'items': items}
          Path('news.json').write_text(json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('Fetched', len(items), 'articles across the three original alert categories.')
          PY
      - name: Commit news.json if changed
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add news.json
          if git diff --cached --quiet; then
            echo 'No news changes.'
            exit 0
          fi
          git commit -m 'Update categorized Google Alerts news'
          git push
      # Publish the refreshed root directory as the GitHub Pages site.
      # In Settings > Pages, select GitHub Actions as the build source.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
